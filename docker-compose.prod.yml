services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thutil_app_prod
    restart: always
    working_dir: /var/www/html
    environment:
      - CI_ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - thutil_prod_network

  web:
    image: nginx:alpine
    container_name: thutil_web_prod
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - thutil_prod_network

  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: thutil_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thutil}
      POSTGRES_USER: ${POSTGRES_USER:-thutil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thutil} -d ${POSTGRES_DB:-thutil}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - thutil_prod_network

volumes:
  postgres_prod_data:
    driver: local

networks:
  thutil_prod_network:
    driver: bridge
