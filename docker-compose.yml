services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thutil_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      - CI_ENVIRONMENT=development
    depends_on:
      db:
        condition: service_healthy
    networks:
      - thutil_network

  web:
    image: nginx:alpine
    container_name: thutil_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - thutil_network

  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: thutil_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: thutil
      POSTGRES_USER: thutil
      POSTGRES_PASSWORD: secretpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thutil -d thutil"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - thutil_network

volumes:
  postgres_data:
    driver: local

networks:
  thutil_network:
    driver: bridge
